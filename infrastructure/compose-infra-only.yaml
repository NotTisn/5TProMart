# =============================================================================
# 5TPROMART - INFRASTRUCTURE ONLY (For Local Development)
# =============================================================================
# Start with: docker compose -f compose-infra-only.yaml up -d
# =============================================================================
# This file contains ONLY stateful infrastructure services:
# - PostgreSQL (database)
# - Keycloak (identity provider)
#
# Your Spring Boot application runs NATIVELY with hot reload.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fivetpromart-postgres
    environment:
      POSTGRES_DB: fivetpromart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: votrungtin2005
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./seed/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fivetpromart-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fivetpromart_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Keycloak Identity Provider
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fivetpromart-keycloak
    command: start-dev --import-realm
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Use embedded H2 for dev simplicity
      KC_DB: dev-file
      # HTTP port (matching application.yml idp.url)
      KC_HTTP_PORT: 8180
      # Health check
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      # Persist Keycloak data
      - ./data/keycloak:/opt/keycloak/data/h2
      # Auto-import realm on first start
      - ./keycloak-config:/opt/keycloak/data/import
    networks:
      - fivetpromart-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

# =============================================================================
# Network
# =============================================================================
networks:
  fivetpromart-net:
    driver: bridge
