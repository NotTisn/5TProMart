# =============================================================================
# 5TPROMART - FULL STACK (For CI/CD, Demos, Production-like Testing)
# =============================================================================
# Start with: docker compose up -d --build
# =============================================================================
# This file builds the Spring Boot app into a Docker container.
# Use for:
# - CI/CD pipelines
# - Production-like testing
# - Demos without IDE
#
# For daily development with hot reload, use: compose-infra-only.yaml
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fivetpromart-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./seed/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fivetpromart-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Keycloak Identity Provider
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fivetpromart-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: dev-file
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./data/keycloak:/opt/keycloak/data/h2
      - ./keycloak-config:/opt/keycloak/data/import
    networks:
      - fivetpromart-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 5TProMart API (Spring Boot Application)
  # ---------------------------------------------------------------------------
  fivetpromart-api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: fivetpromart-api
    environment:
      # Use Docker profile for container-aware URLs
      SPRING_PROFILES_ACTIVE: docker
      # Database connection (using container hostname)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # Keycloak (using container hostname)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8180/realms/fivetpro
      IDP_URL: http://keycloak:8180
    ports:
      - "8080:8080"
    networks:
      - fivetpromart-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

# =============================================================================
# Network
# =============================================================================
networks:
  fivetpromart-net:
    driver: bridge
