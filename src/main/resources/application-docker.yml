# =============================================================================
# 5TPROMART - Docker Profile Configuration
# =============================================================================
# This profile is activated when running inside Docker containers.
# It uses container hostnames instead of localhost.
# =============================================================================
# Activate with: SPRING_PROFILES_ACTIVE=docker
# =============================================================================

spring:
  config:
    activate:
      on-profile: docker

  # --- DATABASE (Use Docker hostname) ---
  datasource:
    url: jdbc:postgresql://postgres:5432/fivetpromart_db
    username: postgres
    password: ${DB_PASSWORD}

  # --- SECURITY (Use Docker hostname) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/fivetpro

# --- IDP (Keycloak - Use Docker hostname) ---
idp:
  url: http://keycloak:8180
  realm: fivetpro
  client-id: fivetpro
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

notification:
  email:
    brevo-url: https://api.brevo.com
    brevo-apikey: ${BREVO_API_KEY}
    sender-email: tinvo2005@gmail.com
    sender-name: FiveTProMart Corp.
