# Tên ứng dụng Spring
spring:
  application:
    name: 5TProMart
  
  # --- CẤU HÌNH DATABASE (PostgreSQL) ---
  datasource:
    url: jdbc:postgresql://localhost:5432/fivetpromart_db
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # --- CẤU HÌNH JPA/HIBERNATE ---
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # --- CẤU HÌNH JACKSON (JSON) ---
  jackson:
    serialization:
      indent_output: true

  # --- CẤU HÌNH BẢO MẬT (RESOURCE SERVER) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/fivetpro

# --- CẤU HÌNH SERVER ---
server:
  port: 8080

# --- CẤU HÌNH LOGGING ---
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    com.fivetpromart.infrastructure.identity.keycloak.client: DEBUG
    feign: DEBUG

# --- CẤU HÌNH IDP (Keycloak) (dùng cho Feign Client/Adapter) ---
idp:
  url: http://localhost:8180
  realm: fivetpro
  client-id: fivetpro
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

# --- CẤU HÌNH APP (OTP) ---
app:
  otp:
    secret: ${APP_OTP_SECRET}
    ttl-seconds: 600
    max-attempts: 5
  signup:
    cleanup-millis: 3600000

notification:
  email:
    brevo-url: https://api.brevo.com
    brevo-apikey: ${BREVO_API_KEY}
    sender-email: tinvo2005@gmail.com
    sender-name: FiveTProMart Corp.

# --- BUSINESS RULES CONFIGURATION ---
# Cash payment rounding (Vietnam retail standard)
payment:
  cash:
    rounding-unit: 1000        # Round to nearest 1,000 VND
    rounding-mode: HALF_UP     # 500 rounds up, 499 rounds down
    
# Product & inventory rules  
inventory:
  low-stock-threshold: 10      # Products with stock < 10 are "low stock"
  expiry-warning-days: 30      # Flag lots expiring within 30 days

# --- DEVELOPMENT SECURITY BYPASS ---
# Set to true to grant all roles to authenticated users (disables role-based authorization)
# Useful for endpoint testing without role restrictions
# WARNING: Never enable in production environments
security:
  bypass-enabled: ${SECURITY_BYPASS:false}

# --- AI ANALYTICS SERVICE ---
# Python microservice for demand forecasting, bundle insights, margin optimization
analytics:
  service:
    url: ${ANALYTICS_SERVICE_URL:http://localhost:8090}
    enabled: ${ANALYTICS_ENABLED:true}